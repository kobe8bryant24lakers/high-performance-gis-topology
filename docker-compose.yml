services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis_topology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis_topology"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gis_topology
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: local
      ADMIN_SEED_TOKEN: dev-seed-token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8080/api/topology/search?q=health' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  seeder:
    image: postgres:16-alpine
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./backend/src/test/resources/test-data.sql:/test-data.sql:ro
    environment:
      PGPASSWORD: postgres
    command: psql -h postgres -U postgres -d gis_topology -v ON_ERROR_STOP=1 -f /test-data.sql

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
