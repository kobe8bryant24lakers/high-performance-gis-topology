spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gis_topology
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.topology.gis.shared.typehandler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: input

server:
  port: 8080

# Admin seed endpoint — only active under the "local" Spring profile.
# Override admin.seed.token via environment variable or application-local.yml.
# Never use the default value in any shared environment.
admin:
  seed:
    token: ${ADMIN_SEED_TOKEN:dev-only-change-me}

logging:
  level:
    com.topology.gis: INFO
